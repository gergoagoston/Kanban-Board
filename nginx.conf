worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
	    # hash $remote_addr$http_user_agent$request_uri consistent;
        ip_hash;
        server host.docker.internal:8080;  # Use your PC’s localhost
        server host.docker.internal:8081;  # Use your PC’s localhost
    }

    server {
        listen 80;

        # API Proxy (Sticky Sessions per Tab)
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Request-ID $request_uri;
        }

        # WebSocket Proxy (Sticky Sessions per Tab)
        location /ws/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Request-ID $request_uri;

            # Ensure WebSockets stay alive
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 600s;
        }
    }
}
