
services:
  realtimeweb-tickettrackerproject-nginx:
    image: nginx:latest
    container_name: realtimeweb-tickettrackerproject-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - realtimeweb-tickettrackerproject-rabbitmq
      - realtimeweb-tickettrackerproject-redis

  realtimeweb-tickettrackerproject-rabbitmq:
    image: rabbitmq:3.12.0-rc.2-management-alpine
    restart: unless-stopped
    container_name: realtimeweb-tickettrackerproject-rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
      - 15674:15674
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rtwrabbitvolume:/var/lib/rabbitmq

  realtimeweb-tickettrackerproject-redis:
    image: redis:6.2.6
    restart: unless-stopped
    container_name: realtimeweb-tickettrackerproject-redis
    ports:
      - 6379:6379

volumes:
  rtwrabbitvolume:
























